# 每次推送與 PR：跑測試、建置 Docker image，並用真正的 SQL Server 做 smoke test。
# 推送到 main：image 只以 sha-xxxxxxx 標籤推上 Docker Hub（可供測試或回復），不會上線。
# 打 v* 標籤（例如 git tag v0.1.2 && git push origin v0.1.2）：另外更新 latest 與版本號標籤，
# 遠端主機的 deploy/update.sh 追 latest，所以只有打標籤的版本會上線。
#
# 需要在 GitHub repo 的 Settings → Secrets and variables → Actions 設定：
#   DOCKERHUB_USERNAME  Docker Hub 帳號（放在 Variables 或 Secrets 皆可）
#   DOCKERHUB_TOKEN     Docker Hub 的 Access Token（Read & Write），放在 Secrets
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Backend tests
        run: dotnet test

      - name: Migrations match the data model
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/Attendance.Api
        env:
          # The EF tools start the app's host builder, which requires these; no database is contacted.
          ConnectionStrings__Default: Server=unused
          Jwt__Key: ci-placeholder-signing-key-0123456789-0123456789

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend lint and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: attendance-system:ci
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test with SQL Server
        run: sh deploy/smoke-test.sh attendance-system:ci

      - name: Check Docker Hub settings
        if: env.PUBLISH == 'true'
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::請在 repo 設定 DOCKERHUB_USERNAME 與 DOCKERHUB_TOKEN（Settings → Secrets and variables → Actions）"
            exit 1
          fi

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/nkec-attendance-system
          # latest (what the server deploys) only moves on a release tag, never on a plain push.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Same inputs as "Build image", so this reuses its cache instead of building again.
      - name: Push to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
